name: Daily Crawl

on:
  schedule:
    # UTC 23:00 = 北京时间次日 07:00（对应原 HANDOFF P2 触发时间）
    - cron: "0 23 * * *"
  workflow_dispatch:  # 手动触发按钮，调试用

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          python -B crawler.py

      - name: Sync embeddings to vector table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          python -B topic_matcher.py
